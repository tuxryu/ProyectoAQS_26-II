name: CI

on:
  pull_request:
    branches: [main, desarrollo]
  push:
    branches: [main, desarrollo]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Checkstyle
        run: bash ./mvnw -B checkstyle:check

      - name: Compilar y probar
        run: bash ./mvnw -B verify
