<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - Sistema Intermediario de Pólizas'">Sistema Intermediario de Pólizas</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<header class="navbar" th:fragment="navbar(activa)">
    <div class="navbar-inner">
        <a class="navbar-brand" th:href="@{/}">Sistema Intermediario de Pólizas</a>
        <nav class="navbar-links" aria-label="Navegación principal">
            <a th:href="@{/}" th:classappend="${activa == 'inicio'} ? 'activo'">Inicio</a>
            <a th:href="@{/web/clientes}" th:classappend="${activa == 'clientes'} ? 'activo'">Clientes</a>
            <a th:href="@{/web/polizas}" th:classappend="${activa == 'polizas'} ? 'activo'">Pólizas</a>
            <a th:href="@{/web/beneficiarios}" th:classappend="${activa == 'beneficiarios'} ? 'activo'">Beneficiarios</a>
        </nav>
    </div>
</header>

<div th:fragment="alerta"
     th:if="${alerta != null}"
     role="alert"
     th:class="'alerta alerta-' + ${alerta.tipo}">
    <div class="alerta-titulo">
        <span class="badge badge-http"
              th:if="${alerta.codigo != null}"
              th:text="'HTTP ' + ${alerta.codigo}">HTTP 404</span>
        <span th:text="${alerta.titulo}">Aviso</span>
    </div>
    <p class="alerta-mensaje" th:text="${alerta.mensaje}">Mensaje de estado.</p>
</div>

</body>
</html>
